<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Evolution of Discovered Formats</text>

  <!-- Axes -->
  <line x1="60" y1="350" x2="750" y2="350" stroke="#333" stroke-width="2"/> <!-- X -->
  <line x1="60" y1="50" x2="60" y2="350" stroke="#333" stroke-width="2"/>  <!-- Y -->

  <!-- X-Axis Labels (Episodes) -->
  <text x="60" y="370" text-anchor="middle" font-size="12">0</text>
  <text x="230" y="370" text-anchor="middle" font-size="12">1000</text>
  <text x="400" y="370" text-anchor="middle" font-size="12">2000</text>
  <text x="570" y="370" text-anchor="middle" font-size="12">3000</text>
  <text x="740" y="370" text-anchor="middle" font-size="12">4000</text>
  <text x="400" y="390" text-anchor="middle" font-weight="bold" font-size="14">Training Episodes</text>

  <!-- Y-Axis Labels (Cumulative Formats) -->
  <text x="50" y="350" text-anchor="end" font-size="12">0</text>
  <text x="50" y="275" text-anchor="end" font-size="12">15</text>
  <text x="50" y="200" text-anchor="end" font-size="12">30</text>
  <text x="50" y="125" text-anchor="end" font-size="12">45</text>
  <text x="50" y="50" text-anchor="end" font-size="12">60</text>
  <text x="20" y="200" text-anchor="middle" font-weight="bold" font-size="14" transform="rotate(-90 20 200)">New Formats Discovered</text>

  <!-- Data Line (Smooth Curve Approximation) -->
  <!-- Starts slow, accelerates (exploration), then plateaus (convergence) -->
  <path d="M 60 350 
           Q 230 340, 300 250 
           Q 400 150, 500 100 
           Q 650 60, 750 60" 
        fill="none" stroke="#2196f3" stroke-width="4" />

  <!-- Markers/Annotations -->
  <circle cx="300" cy="250" r="5" fill="#2196f3" />
  <text x="310" y="250" font-size="12" fill="#333">Exploration Phase</text>

  <circle cx="650" cy="60" r="5" fill="#2196f3" />
  <text x="660" y="80" font-size="12" fill="#333">Convergence Phase</text>

  <!-- Grid lines (optional light) -->
  <line x1="60" y1="275" x2="750" y2="275" stroke="#eee" stroke-width="1"/>
  <line x1="60" y1="200" x2="750" y2="200" stroke="#eee" stroke-width="1"/>
  <line x1="60" y1="125" x2="750" y2="125" stroke="#eee" stroke-width="1"/>

</svg>
