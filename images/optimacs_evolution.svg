<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Node 1: A/B Testing -->
  <rect x="50" y="80" width="160" height="60" rx="10" ry="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">A/B Testing</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="110" x2="290" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Label 1: Issues with A/B -->
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• No Context</text>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• Static Policy</text>

  <!-- Node 2: Contextual Bandits -->
  <rect x="300" y="80" width="160" height="60" rx="10" ry="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="380" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">Contextual Bandit</text>

  <!-- Arrow 2 -->
  <line x1="460" y1="110" x2="540" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Label 2: Issues with Bandits -->
  <text x="500" y="90" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• No Transitions</text>
  <text x="500" y="105" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• Myopic (1-step)</text>

  <!-- Node 3: MDP -->
  <rect x="550" y="80" width="160" height="60" rx="10" ry="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="630" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">MDP</text>

  <!-- Arrow 3 -->
  <line x1="710" y1="110" x2="790" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Label 3: Issues with MDP -->
  <text x="750" y="90" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• Fixed Space</text>
  <text x="750" y="105" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">• Stationary</text>

  <!-- Node 4: EMDP -->
  <rect x="800" y="80" width="160" height="60" rx="10" ry="10" fill="#d1c4e9" stroke="#512da8" stroke-width="3"/>
  <text x="880" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#512da8">EMDP</text>
  <text x="880" y="160" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#512da8">(Our Solution)</text>
</svg>
